    <!-- Vista previa al compartir el enlace (public/og.png, 1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La deuda de las estrellas" />
    <meta property="og:title" content="La deuda de las estrellas" />
    <meta
      property="og:description"
      content="Atrapado en un sistema ajeno con 15 minutos antes de que un agujero negro se lo trague todo, lee las ruinas de los Ausentes y usa la relatividad para resolver sus puzzles. Juego 3D de bucle de tiempo, gratis en el navegador."

    <meta

      content="https://the-debt-of-the-stars.anthonygamez2858.workers.dev/og.png"
    />

      content="Un portal de piedra frente a una nave bajo un cielo anaranjado"
    />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="La deuda de las estrellas" />
    <meta
      name="twitter:description"
      content="Atrapado en un sistema ajeno con 15 minutos antes de que un agujero negro se lo trague todo, lee las ruinas de los Ausentes y usa la relatividad para resolver sus puzzles. Juego 3D de bucle de tiempo, gratis en el navegador."
    />
    <meta
      name="twitter:image"
      content="https://the-debt-of-the-stars.anthonygamez2858.workers.dev/og.png"
    />
    <title>La deuda de las estrellas</title>
    <!-- Si se viene del gusano, la página nace ya en blanco (en negro si se viene del horizonte), antes de que llegue el juego (src/ui/arrival.ts). -->
    <style>
      html.llegando,
      html.llegando body {
        background: #fff3e2;
      }

      html.llegando-negro,
      html.llegando-negro body {
        background: #000;
      }

      html.llegando #status {
        visibility: hidden;
      }

      /* La pantalla de carga (src/ui/loadingScreen.ts). Va aquí, en línea, para verse desde el primer instante,
         antes de que llegue el código del juego: nunca más una página en blanco. Medidas en vmin/vh (aún no hay
         --ui-scale). Los textos los pone el juego (traducidos); hasta entonces solo se ven las fotos y la barra. */
      html,
      body {
        background: #07070c;
      }

      .loading {
        position: fixed;
        inset: 0;
        z-index: 900;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2vh;
        padding: 16px;
        background: radial-gradient(ellipse at 50% 40%, #1d2440 0%, #0d0f1a 58%, #07070c 100%);
        color: #cff8e2;
        font-family: 'Caveat', 'Segoe Print', cursive;
        transition: opacity 0.9s ease;
      }

      .loading-passthrough {
        pointer-events: none;
      }

      .loading-done {
        opacity: 0;
        pointer-events: none;
      }

      html.llegando .loading {
        display: none;
      }

      .loading-photos {
        position: relative;
        width: min(88vw, 620px, 74vh);
        aspect-ratio: 800 / 640;
      }

      .loading-photo {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 3% 3% 0;
        background: #f7f1e1;
        border-radius: 3px;
        box-shadow:
          0 18px 40px rgb(0 0 0 / 55%),
          0 0 0 1px rgb(255 255 255 / 4%);
        opacity: 0;
        transform: rotate(var(--tilt, -1.5deg));
        animation: loading-photo 24s ease-in-out infinite both;
      }

      .loading-photo:nth-child(2) {
        --tilt: 1.6deg;
        animation-delay: 8s;
      }

      .loading-photo:nth-child(3) {
        --tilt: -0.8deg;
        animation-delay: 16s;
      }

      /* La cinta que sujeta cada foto. */
      .loading-photo::before {
        content: '';
        position: absolute;
        top: -2.2%;
        left: 50%;
        width: 22%;
        height: 6%;
        background: rgb(246 238 214 / 70%);
        transform: translateX(-50%) rotate(-3deg);
        box-shadow: 0 1px 2px rgb(0 0 0 / 15%);
      }

      .loading-photo img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 2px;
      }

      .loading-photo figcaption {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 12.5%;
        padding: 0 4%;
        color: #3a2f25;
        font-size: clamp(16px, 3.4vmin, 26px);
        line-height: 1.1;
        text-align: center;
      }

      @keyframes loading-photo {
        0% {
          opacity: 0;
          transform: rotate(var(--tilt, -1.5deg)) scale(0.985);
        }
        4%,
        30% {
          opacity: 1;
        }
        34% {
          opacity: 0;
          transform: rotate(var(--tilt, -1.5deg)) scale(1.015);
        }
        100% {
          opacity: 0;
        }
      }

      .loading-title {
        margin: 1vh 0 0;
        min-height: 1.2em;
        color: #f6c37a;
        font-size: clamp(26px, 5vmin, 44px);
        font-weight: 700;
        text-align: center;
        text-shadow: 0 0 18px rgb(246 195 122 / 35%);
      }

      .loading-bar {
        position: relative;
        width: min(70vw, 380px);
        height: 6px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(207 248 226 / 12%);
      }

      .loading-bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 30%;
        border-radius: 3px;
        background: #a6f0c9;
        box-shadow: 0 0 10px #a6f0c9;
        animation: loading-wait 1.8s ease-in-out infinite;
        transition: width 0.5s ease;
      }

      /* Con el juego ya contando, la barra dice cuánto falta. */
      .loading-live .loading-bar span {
        left: 0;
        animation: none;
      }

      @keyframes loading-wait {
        0% {
          left: -30%;
        }
        100% {
          left: 100%;
        }
      }

      .loading-step,
      .loading-music {
        margin: 0;
        min-height: 1.3em;
        font-family: 'Alegreya', Georgia, serif;
        font-size: clamp(14px, 2.3vmin, 18px);
        text-align: center;
      }

      .loading-step {
        color: #9cc2b2;
      }

      .loading-failed .loading-step {
        color: #f2a08a;
      }

      .loading-music {
        position: absolute;
        bottom: max(16px, 3vh);
        left: 16px;
        right: 16px;
        color: #f6c37a;
        opacity: 0.85;
        transition: opacity 0.6s ease;
      }

      .loading-music[hidden] {
        display: block;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-photo,
        .loading-bar span {
          animation: none;
        }

        .loading-photo:first-child {
          opacity: 1;
        }
      }
    </style>
    <script>
      try {
        const cruce = sessionStorage.getItem('bucle-tiempo:gusano');
        if (cruce !== null) {
          document.documentElement.classList.add('llegando');
          if (cruce === 'negro') document.documentElement.classList.add('llegando-negro');
        }
      } catch {
        // Sin sesión: se despierta sin el blanco.
      }
    </script>
  </head>
  <body>
    <canvas id="game" aria-label="Vista del juego"></canvas>
    <!-- El trazo tembloroso de lo dibujado a mano en el HUD (src/ui/theme.css). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="wobble">
        <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" />
        <feDisplacementMap in="SourceGraphic" scale="2.6" />
      </filter>
    </svg>
    <div id="loading" class="loading" aria-busy="true">
      <div class="loading-photos" aria-hidden="true">
        <figure class="loading-photo">
          <img src="./carga/ool.svg" alt="" width="800" height="560" />
          <figcaption></figcaption>
        </figure>
        <figure class="loading-photo">
          <img src="./carga/albatros.svg" alt="" width="800" height="560" />
          <figcaption></figcaption>
        </figure>
        <figure class="loading-photo">
          <img src="./carga/sistema.svg" alt="" width="800" height="560" />
          <figcaption></figcaption>
        </figure>
      </div>
      <h1 class="loading-title"></h1>
      <div class="loading-bar"><span></span></div>
      <p class="loading-step" role="status"></p>
      <p class="loading-music" hidden></p>
    </div>
    <p id="status" role="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

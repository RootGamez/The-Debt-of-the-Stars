<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Instalado como app, el teléfono se queda en horizontal y a pantalla completa (public/manifest.webmanifest). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#15211b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Atrapado en un sistema ajeno con 15 minutos antes de que un agujero negro se lo trague todo, lee las ruinas de los Ausentes y usa la relatividad para resolver sus puzzles. Juego 3D de bucle de tiempo, gratis en el navegador."
    />
    <link rel="canonical" href="https://the-debt-of-the-stars.anthonygamez2858.workers.dev/" />
    <!-- Vista previa al compartir el enlace (public/og.png, 1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La deuda de las estrellas" />
    <meta property="og:title" content="La deuda de las estrellas" />
    <meta
      property="og:description"
      content="Atrapado en un sistema ajeno con 15 minutos antes de que un agujero negro se lo trague todo, lee las ruinas de los Ausentes y usa la relatividad para resolver sus puzzles. Juego 3D de bucle de tiempo, gratis en el navegador."
    />
    <meta property="og:url" content="https://the-debt-of-the-stars.anthonygamez2858.workers.dev/" />
    <meta
      property="og:image"
      content="https://the-debt-of-the-stars.anthonygamez2858.workers.dev/og.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Un portal de piedra frente a una nave bajo un cielo anaranjado"
    />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="La deuda de las estrellas" />
    <meta
      name="twitter:description"
      content="Atrapado en un sistema ajeno con 15 minutos antes de que un agujero negro se lo trague todo, lee las ruinas de los Ausentes y usa la relatividad para resolver sus puzzles. Juego 3D de bucle de tiempo, gratis en el navegador."
    />
    <meta
      name="twitter:image"
      content="https://the-debt-of-the-stars.anthonygamez2858.workers.dev/og.png"
    />
    <title>La deuda de las estrellas</title>
    <!-- Si se viene del gusano, la página nace ya en blanco (en negro si se viene del horizonte), antes de que llegue el juego (src/ui/arrival.ts). -->
    <style>
      html.llegando,
      html.llegando body {
        background: #fff3e2;
      }

      html.llegando-negro,
      html.llegando-negro body {
        background: #000;
      }

      html.llegando #status {
        visibility: hidden;
      }
    </style>
    <script>
      try {
        const cruce = sessionStorage.getItem('bucle-tiempo:gusano');
        if (cruce !== null) {
          document.documentElement.classList.add('llegando');
          if (cruce === 'negro') document.documentElement.classList.add('llegando-negro');
        }
      } catch {
        // Sin sesión: se despierta sin el blanco.
      }
    </script>
  </head>
  <body>
    <canvas id="game" aria-label="Vista del juego"></canvas>
    <!-- El trazo tembloroso de lo dibujado a mano en el HUD (src/ui/theme.css). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="wobble">
        <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" />
        <feDisplacementMap in="SourceGraphic" scale="2.6" />
      </filter>
    </svg>
    <p id="status" role="status">Cargando…</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

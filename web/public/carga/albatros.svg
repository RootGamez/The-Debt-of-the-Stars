<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <!-- La pantalla de carga (src/ui/loadingScreen.ts): el Albatros II en el hangar abierto del Instituto, de noche,
       con la ruta del primer vuelo trazada hasta la Luna y el explorador al pie de la escalerilla. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1430" />
      <stop offset=".55" stop-color="#26345e" />
      <stop offset=".85" stop-color="#4c4a72" />
    </linearGradient>
    <radialGradient id="moonHalo">
      <stop offset="0" stop-color="#fff6e2" stop-opacity=".5" />
      <stop offset="1" stop-color="#fff6e2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#fbf4e4" />
      <stop offset=".7" stop-color="#e6dbc2" />
      <stop offset="1" stop-color="#b9ad94" />
    </radialGradient>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".9" />
      <stop offset="1" stop-color="#ffb066" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tip">
      <stop offset="0" stop-color="#fffbd6" />
      <stop offset=".4" stop-color="#fff27a" />
      <stop offset="1" stop-color="#fff27a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead9b0" />
      <stop offset="1" stop-color="#a88f68" />
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcbc" />
      <stop offset="1" stop-color="#bba57c" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0" />
      <stop offset="1" stop-color="#ffd9a0" stop-opacity=".28" />
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#night)" />
  <g fill="#fff6e2">
    <circle cx="50" cy="50" r="1.4" opacity=".9" /><circle cx="120" cy="120" r="1" opacity=".6" />
    <circle cx="200" cy="34" r="1.2" opacity=".8" /><circle cx="250" cy="150" r="1" opacity=".5" />
    <circle cx="320" cy="70" r="1.6" opacity=".9" /><circle cx="400" cy="24" r="1" opacity=".6" />
    <circle cx="452" cy="132" r="1.2" opacity=".7" /><circle cx="520" cy="60" r="1" opacity=".5" />
    <circle cx="770" cy="210" r="1.3" opacity=".7" /><circle cx="740" cy="34" r="1" opacity=".6" />
    <circle cx="30" cy="200" r="1.2" opacity=".6" /><circle cx="160" cy="220" r="1" opacity=".5" />
    <circle cx="690" cy="260" r="1" opacity=".4" /><circle cx="580" cy="230" r="1" opacity=".4" />
  </g>

  <!-- La Luna, grande, y la ruta prevista hasta ella. -->
  <circle cx="640" cy="130" r="150" fill="url(#moonHalo)" />
  <circle cx="640" cy="130" r="66" fill="url(#moon)" />
  <g fill="#cdbf9f">
    <circle cx="616" cy="108" r="11" /><circle cx="660" cy="150" r="8" /><circle cx="668" cy="98" r="5" />
    <circle cx="624" cy="162" r="5" />
  </g>
  <path d="M676 116 l7 -3 l4 8 l-8 3 Z" fill="#f4dca6" />
  <path d="M410 300 C440 200 520 160 588 150" fill="none" stroke="#f6e7c8" stroke-width="2.4" stroke-dasharray="2 10" stroke-linecap="round" opacity=".8" />
  <path d="M578 142 L592 150 L578 158" fill="none" stroke="#f6e7c8" stroke-width="2.4" stroke-linecap="round" opacity=".8" />

  <!-- Montes de Hogar al fondo. -->
  <path d="M0 380 L80 336 L170 362 L250 318 L330 352 L420 330 L520 360 L600 334 L700 358 L800 330 L800 440 L0 440 Z" fill="#2a2f4a" />
  <path d="M0 400 L110 372 L210 392 L320 368 L440 392 L560 370 L680 392 L800 374 L800 450 L0 450 Z" fill="#232840" />

  <!-- El hangar abierto: dos pilares y la viga, con la luz cayendo sobre la nave. -->
  <path d="M136 470 L196 190 L604 190 L664 470 Z" fill="url(#beam)" />
  <rect x="112" y="176" width="576" height="20" rx="3" fill="#3b2a20" />
  <rect x="112" y="196" width="26" height="280" fill="#33251c" />
  <rect x="662" y="196" width="26" height="280" fill="#33251c" />
  <g fill="#ffd9a0">
    <circle cx="260" cy="200" r="5" /><circle cx="400" cy="200" r="5" /><circle cx="540" cy="200" r="5" />
  </g>
  <g fill="url(#warm)">
    <circle cx="260" cy="206" r="28" /><circle cx="400" cy="206" r="28" /><circle cx="540" cy="206" r="28" />
  </g>

  <!-- La plataforma, en facetas. -->
  <path d="M0 450 L800 440 L800 560 L0 560 Z" fill="#3a3f36" />
  <path d="M0 480 L180 466 L400 484 L620 466 L800 478 L800 560 L0 560 Z" fill="#30352d" />
  <ellipse cx="400" cy="462" rx="250" ry="22" fill="#4d5145" />
  <ellipse cx="400" cy="462" rx="200" ry="16" fill="none" stroke="#c98d4e" stroke-width="3" stroke-dasharray="14 10" opacity=".7" />

  <!-- El Albatros II. -->
  <g>
    <path d="M300 398 L274 458 M500 398 L526 458 M400 404 L400 462" stroke="#4d3e2e" stroke-width="8" stroke-linecap="round" />
    <path d="M262 458 h24 M514 458 h24 M388 462 h24" stroke="#4d3e2e" stroke-width="7" stroke-linecap="round" />
    <path d="M296 370 Q400 270 504 370 Z" fill="url(#dome)" />
    <path d="M330 344 Q400 296 470 344" fill="none" stroke="#fbf3dd" stroke-width="4" opacity=".8" />
    <rect x="384" y="300" width="32" height="18" rx="9" fill="#bfe8ef" stroke="#8a7458" stroke-width="3" />
    <ellipse cx="400" cy="376" rx="180" ry="30" fill="url(#hull)" />
    <ellipse cx="400" cy="396" rx="156" ry="16" fill="#6d5a45" />
    <path d="M232 380 Q400 404 568 380" fill="none" stroke="#8a7458" stroke-width="2.5" />
    <g fill="#ffd9a0">
      <circle cx="262" cy="377" r="6" /><circle cx="302" cy="384" r="6" /><circle cx="342" cy="388" r="6" />
      <circle cx="384" cy="390" r="6" /><circle cx="426" cy="390" r="6" /><circle cx="468" cy="388" r="6" />
      <circle cx="508" cy="384" r="6" /><circle cx="546" cy="377" r="6" />
    </g>
    <!-- Toberas, apagadas. -->
    <g fill="#5a4732">
      <rect x="226" y="364" width="14" height="10" rx="3" /><rect x="560" y="364" width="14" height="10" rx="3" />
    </g>
    <!-- La escalerilla a popa. -->
    <path d="M560 392 L606 462 M576 388 L622 458 M572 410 h16 M584 428 h16 M596 446 h16" stroke="#5a4732" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- El explorador, al pie de la escalerilla, con el casco bajo el brazo y la vista en la Luna. -->
  <g transform="translate(628 410) scale(.56)">
    <path d="M44 26 C40 16 38 10 36 4 M56 26 C62 18 66 12 70 6" fill="none" stroke="#3f6f5f" stroke-width="3" stroke-linecap="round" />
    <circle cx="36" cy="4" r="10" fill="url(#tip)" />
    <circle cx="70" cy="6" r="10" fill="url(#tip)" />
    <ellipse cx="37" cy="91" rx="11" ry="5" fill="#35261c" />
    <ellipse cx="63" cy="91" rx="11" ry="5" fill="#35261c" />
    <path d="M50 24 C74 24 86 42 86 62 C86 80 70 90 50 90 C30 90 14 80 14 62 C14 42 26 24 50 24 Z" fill="#9fe6c9" />
    <path d="M15 66 C18 86 34 92 50 92 C66 92 82 86 85 66 C70 74 30 74 15 66 Z" fill="#6b7445" />
    <rect x="26" y="76" width="12" height="9" rx="2" fill="#8a5a34" />
    <ellipse cx="44" cy="48" rx="7" ry="8.5" fill="#15181d" />
    <ellipse cx="66" cy="46" rx="7" ry="8.5" fill="#15181d" />
    <circle cx="47" cy="44" r="2.2" fill="#f4fbff" />
    <circle cx="69" cy="42" r="2.2" fill="#f4fbff" />
    <circle cx="96" cy="70" r="16" fill="#dff4ff" fill-opacity=".25" stroke="#dff4ff" stroke-width="2" />
    <path d="M86 62 Q90 56 98 56" fill="none" stroke="#fff" stroke-width="2" opacity=".7" />
  </g>

  <!-- Esporas. -->
  <g fill="url(#tip)">
    <circle cx="90" cy="300" r="4" /><circle cx="720" cy="320" r="4.5" /><circle cx="170" cy="420" r="3" />
    <circle cx="640" cy="380" r="3" />
  </g>
</svg>

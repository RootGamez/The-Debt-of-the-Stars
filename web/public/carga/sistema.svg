<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <!-- La pantalla de carga (src/ui/loadingScreen.ts): la Brasa, enana roja, y sus mundos en el orden de
       data/sistema.json (Taller, Cicatriz, Archivo, Umbral y, lejos, el Observatorio). Sin el Laboratorio: está oculto. -->
  <defs>
    <radialGradient id="space" cx=".5" cy=".5" r=".75">
      <stop offset="0" stop-color="#2a1a2c" />
      <stop offset=".55" stop-color="#120f1e" />
      <stop offset="1" stop-color="#07070c" />
    </radialGradient>
    <radialGradient id="corona">
      <stop offset="0" stop-color="#ffb070" stop-opacity=".75" />
      <stop offset=".35" stop-color="#ff7a3a" stop-opacity=".28" />
      <stop offset="1" stop-color="#ff7a3a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="brasa" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#fff0cf" />
      <stop offset=".35" stop-color="#ffbe72" />
      <stop offset=".8" stop-color="#f06a2e" />
      <stop offset="1" stop-color="#b8401e" />
    </radialGradient>
    <radialGradient id="umbral" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#f7d29a" />
      <stop offset=".55" stop-color="#d9894a" />
      <stop offset="1" stop-color="#5e2f22" />
    </radialGradient>
    <radialGradient id="archivo" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#bcd2ea" />
      <stop offset=".5" stop-color="#4f78a8" />
      <stop offset="1" stop-color="#16243f" />
    </radialGradient>
    <radialGradient id="cicatriz" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#d9775a" />
      <stop offset=".55" stop-color="#8c3b2a" />
      <stop offset="1" stop-color="#2e1410" />
    </radialGradient>
    <radialGradient id="shade" cx=".3" cy=".28" r=".85">
      <stop offset=".55" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#000" stop-opacity=".55" />
    </radialGradient>
    <clipPath id="tallerClip"><circle cx="0" cy="0" r="34" /></clipPath>
  </defs>

  <rect width="800" height="560" fill="url(#space)" />
  <g fill="#fff5e6">
    <circle cx="42" cy="38" r="1.3" opacity=".8" /><circle cx="118" cy="140" r="1" opacity=".5" />
    <circle cx="190" cy="60" r="1.6" opacity=".9" /><circle cx="262" cy="500" r="1.2" opacity=".7" />
    <circle cx="330" cy="40" r="1" opacity=".5" /><circle cx="520" cy="30" r="1.4" opacity=".8" />
    <circle cx="610" cy="96" r="1" opacity=".5" /><circle cx="742" cy="70" r="1.6" opacity=".9" />
    <circle cx="770" cy="200" r="1" opacity=".5" /><circle cx="700" cy="520" r="1.3" opacity=".7" />
    <circle cx="60" cy="440" r="1.5" opacity=".8" /><circle cx="140" cy="530" r="1" opacity=".5" />
    <circle cx="470" cy="530" r="1" opacity=".5" /><circle cx="560" cy="470" r="1.2" opacity=".6" />
    <circle cx="20" cy="270" r="1" opacity=".5" /><circle cx="790" cy="330" r="1.2" opacity=".7" />
    <circle cx="380" cy="150" r=".9" opacity=".4" /><circle cx="240" cy="230" r=".9" opacity=".4" />
  </g>

  <!-- Las órbitas, trazadas a mano (algo inclinadas, como se ven desde arriba). -->
  <g transform="rotate(-9 400 290)" fill="none" stroke="#f6e7c8" stroke-linecap="round">
    <ellipse cx="400" cy="290" rx="112" ry="44" stroke-opacity=".38" stroke-width="1.6" stroke-dasharray="6 7" />
    <ellipse cx="400" cy="290" rx="178" ry="70" stroke-opacity=".34" stroke-width="1.6" stroke-dasharray="6 7" />
    <ellipse cx="400" cy="290" rx="246" ry="98" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="6 7" />
    <ellipse cx="400" cy="290" rx="316" ry="126" stroke-opacity=".26" stroke-width="1.6" stroke-dasharray="6 7" />
    <ellipse cx="400" cy="290" rx="384" ry="154" stroke-opacity=".18" stroke-width="1.4" stroke-dasharray="3 9" />
  </g>

  <!-- La Brasa. -->
  <circle cx="400" cy="290" r="170" fill="url(#corona)" />
  <circle cx="400" cy="290" r="46" fill="url(#brasa)" />
  <g fill="#c4521f" opacity=".45">
    <circle cx="384" cy="300" r="5" /><circle cx="414" cy="274" r="3.5" /><circle cx="420" cy="306" r="2.5" />
  </g>

  <!-- El Taller: el gigante de gas con sus cinco islas. -->
  <g transform="translate(305 279)">
    <g clip-path="url(#tallerClip)">
      <rect x="-40" y="-40" width="80" height="80" fill="#e6c48a" />
      <path d="M-40 -22 Q0 -30 40 -20 L40 -10 Q0 -18 -40 -12 Z" fill="#c99a5e" />
      <path d="M-40 0 Q0 -6 40 2 L40 12 Q0 4 -40 10 Z" fill="#b07b47" />
      <path d="M-40 18 Q0 14 40 22 L40 30 Q0 24 -40 28 Z" fill="#d6aa6e" />
      <ellipse cx="12" cy="8" rx="7" ry="3.5" fill="#8f5a33" />
      <circle cx="0" cy="0" r="34" fill="url(#shade)" />
    </g>
    <g fill="#5d6b3e">
      <circle cx="-14" cy="-31" r="2.4" /><circle cx="8" cy="-33" r="2.2" /><circle cx="26" cy="-23" r="2.2" />
      <circle cx="-30" cy="-16" r="2" /><circle cx="33" cy="-6" r="1.8" />
    </g>
  </g>

  <!-- Cicatriz: hueca, con sus ojos y su anillo. -->
  <g transform="translate(558 300)">
    <ellipse cx="0" cy="0" rx="34" ry="8" fill="none" stroke="#b9876a" stroke-width="2.4" stroke-opacity=".7" transform="rotate(-18)" />
    <circle cx="0" cy="0" r="18" fill="url(#cicatriz)" />
    <circle cx="-5" cy="-5" r="4.5" fill="#1a0a08" />
    <circle cx="7" cy="5" r="3" fill="#1a0a08" />
    <circle cx="-6" cy="8" r="2" fill="#1a0a08" />
    <path d="M-34 10 Q0 -2 34 -10" fill="none" stroke="#b9876a" stroke-width="2.4" stroke-opacity=".9" transform="rotate(-8)" />
  </g>

  <!-- El Archivo: un mundo de agua con el anillo seco de la Galería. -->
  <g transform="translate(224 382)">
    <circle cx="0" cy="0" r="20" fill="url(#archivo)" />
    <ellipse cx="0" cy="2" rx="20" ry="5" fill="none" stroke="#dfe9f4" stroke-width="2" stroke-opacity=".8" />
    <path d="M-6 -14 l4 -6 l4 6 Z M4 -15 l3 -5 l3 5 Z" fill="#dfe9f4" opacity=".7" />
  </g>

  <!-- Umbral, donde se despierta: ámbar, con la Boca. -->
  <g transform="translate(675 193)">
    <circle cx="0" cy="0" r="17" fill="url(#umbral)" />
    <path d="M-7 -6 l6 -4 l5 5 l-5 6 Z M3 4 l6 -2 l3 6 l-6 2 Z" fill="#8a4a2c" opacity=".55" />
    <circle cx="-2" cy="-17" r="4" fill="none" stroke="#3a241a" stroke-width="2" />
  </g>

  <!-- El Observatorio, lejos, solo. -->
  <g transform="translate(163 200)">
    <path d="M-7 2 L-4 -6 L4 -7 L8 0 L3 7 L-5 6 Z" fill="#9b968a" />
    <path d="M-2 -6 a4 4 0 0 1 8 0" fill="#d9d2c0" />
  </g>
</svg>

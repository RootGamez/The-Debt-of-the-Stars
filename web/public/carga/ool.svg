<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <!-- La pantalla de carga (src/ui/loadingScreen.ts): los Ool del Instituto juntos en la plaza, la víspera del primer
       vuelo, con el Albatros II detrás y la Luna en el cielo. Mismas formas que los retratos de las charlas. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b52" />
      <stop offset=".34" stop-color="#5d4f78" />
      <stop offset=".56" stop-color="#b9787a" />
      <stop offset=".78" stop-color="#f4c58c" />
    </linearGradient>
    <radialGradient id="moonHalo">
      <stop offset="0" stop-color="#fff6e2" stop-opacity=".55" />
      <stop offset="1" stop-color="#fff6e2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".9" />
      <stop offset="1" stop-color="#ffb066" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tip">
      <stop offset="0" stop-color="#fffbd6" />
      <stop offset=".4" stop-color="#fff27a" />
      <stop offset="1" stop-color="#fff27a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="young" cx=".4" cy=".32" r=".75">
      <stop offset="0" stop-color="#cdf7e4" />
      <stop offset=".55" stop-color="#9fe6c9" />
      <stop offset="1" stop-color="#4f957c" />
    </radialGradient>
    <radialGradient id="old" cx=".4" cy=".32" r=".75">
      <stop offset="0" stop-color="#a9c4b0" />
      <stop offset=".55" stop-color="#7b9784" />
      <stop offset="1" stop-color="#43584a" />
    </radialGradient>
    <radialGradient id="bubble" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35" />
      <stop offset=".7" stop-color="#dff4ff" stop-opacity=".1" />
      <stop offset="1" stop-color="#dff4ff" stop-opacity=".3" />
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d2aa" />
      <stop offset="1" stop-color="#a88f68" />
    </linearGradient>

    <!-- Un Ool en su caja de 100 × 100: los pies tocan el suelo en y = 94. -->
    <g id="feet">
      <ellipse cx="37" cy="91" rx="10" ry="4.5" fill="#2f4a3e" />
      <ellipse cx="63" cy="91" rx="10" ry="4.5" fill="#2f4a3e" />
    </g>
    <path id="blob" d="M50 24 C74 24 86 42 86 62 C86 80 70 90 50 90 C30 90 14 80 14 62 C14 42 26 24 50 24 Z" />
    <g id="face">
      <path d="M22 72 L29 65 M24 79 L33 70 M70 83 L79 74 M74 76 L83 67" stroke="#000" stroke-opacity=".14" stroke-width="2" stroke-linecap="round" />
      <circle cx="26" cy="48" r="1.8" fill="#fff27a" />
      <circle cx="77" cy="64" r="1.8" fill="#fff27a" />
      <circle cx="70" cy="40" r="1.4" fill="#fff27a" />
      <ellipse cx="38" cy="54" rx="7.5" ry="9" fill="#15181d" />
      <ellipse cx="62" cy="54" rx="7.5" ry="9" fill="#15181d" />
      <circle cx="40.5" cy="50.5" r="2.4" fill="#f4fbff" />
      <circle cx="64.5" cy="50.5" r="2.4" fill="#f4fbff" />
      <circle cx="36" cy="58" r="1" fill="#f4fbff" opacity=".7" />
      <circle cx="60" cy="58" r="1" fill="#f4fbff" opacity=".7" />
    </g>
    <g id="twoFil" fill="none" stroke="#3f6f5f" stroke-width="2.4" stroke-linecap="round">
      <path d="M44 26 C40 18 36 16 31 13" />
      <path d="M56 26 C60 18 64 16 69 13" />
      <circle cx="31" cy="13" r="9" fill="url(#tip)" stroke="none" />
      <circle cx="69" cy="13" r="9" fill="url(#tip)" stroke="none" />
    </g>
    <g id="threeFil" fill="none" stroke="#3f5f50" stroke-width="2.4" stroke-linecap="round">
      <path d="M42 26 C38 14 34 10 29 6" />
      <path d="M50 24 C50 12 51 8 52 1" />
      <path d="M58 26 C64 16 68 12 74 7" />
      <circle cx="29" cy="6" r="9" fill="url(#tip)" stroke="none" />
      <circle cx="52" cy="1" r="9" fill="url(#tip)" stroke="none" />
      <circle cx="74" cy="7" r="9" fill="url(#tip)" stroke="none" />
    </g>
    <g id="arms">
      <ellipse cx="14" cy="68" rx="5" ry="9" transform="rotate(20 14 68)" />
      <ellipse cx="86" cy="68" rx="5" ry="9" transform="rotate(-20 86 68)" />
    </g>
  </defs>

  <rect width="800" height="560" fill="url(#sky)" />
  <g fill="#fff6e2">
    <circle cx="60" cy="40" r="1.3" opacity=".8" /><circle cx="130" cy="92" r="1" opacity=".6" />
    <circle cx="214" cy="30" r="1.5" opacity=".9" /><circle cx="300" cy="74" r="1" opacity=".5" />
    <circle cx="372" cy="22" r="1.2" opacity=".8" /><circle cx="446" cy="60" r="1" opacity=".6" />
    <circle cx="510" cy="18" r="1.6" opacity=".9" /><circle cx="760" cy="44" r="1.2" opacity=".7" />
    <circle cx="720" cy="140" r="1" opacity=".5" /><circle cx="28" cy="130" r="1" opacity=".5" />
    <circle cx="410" cy="120" r="1" opacity=".4" /><circle cx="560" cy="150" r="1" opacity=".4" />
  </g>

  <!-- La Luna, adonde iba el primer vuelo. -->
  <circle cx="626" cy="96" r="120" fill="url(#moonHalo)" />
  <circle cx="626" cy="96" r="36" fill="#f1e8d4" />
  <path d="M610 82 l9 -4 l6 7 l-8 6 Z M636 104 l8 -3 l4 8 l-9 2 Z M618 112 l5 -2 l3 5 l-6 1 Z" fill="#d8ccb2" />

  <!-- Colinas lejanas, en facetas. -->
  <path d="M0 360 L70 318 L150 340 L230 300 L320 332 L410 296 L500 326 L590 300 L690 330 L800 306 L800 420 L0 420 Z" fill="#6d5872" />
  <path d="M0 380 L90 350 L180 368 L270 340 L360 362 L460 338 L560 360 L660 340 L800 360 L800 430 L0 430 Z" fill="#5a4a5f" />

  <!-- El Instituto: la cúpula con su ventana redonda encendida y el telescopio. -->
  <circle cx="150" cy="282" r="70" fill="url(#warm)" opacity=".55" />
  <path d="M46 400 L46 318 Q150 196 254 318 L254 400 Z" fill="#4a3626" />
  <path d="M46 318 Q150 196 254 318" fill="none" stroke="#6b4e36" stroke-width="5" />
  <path d="M150 220 L150 318 M98 248 L120 318 M202 248 L180 318" stroke="#3b2a1e" stroke-width="3" />
  <circle cx="150" cy="282" r="20" fill="#ffd9a0" stroke="#7a5534" stroke-width="5" />
  <path d="M150 262 L150 302 M130 282 L170 282" stroke="#c98d4e" stroke-width="2" />
  <path d="M188 230 L232 188" stroke="#3b2a1e" stroke-width="10" stroke-linecap="round" />
  <rect x="64" y="350" width="22" height="30" rx="3" fill="#ffc77e" />
  <rect x="214" y="350" width="22" height="30" rx="3" fill="#ffc77e" />

  <!-- Casitas de la aldea. -->
  <path d="M286 396 L286 366 L306 348 L326 366 L326 396 Z" fill="#3b2a20" />
  <rect x="300" y="372" width="10" height="10" fill="#ffd08a" />
  <path d="M332 398 L332 374 L348 360 L364 374 L364 398 Z" fill="#33251c" />
  <circle cx="348" cy="382" r="4" fill="#ffd08a" />

  <!-- El Albatros II, posado y con la escalerilla a popa. -->
  <g>
    <circle cx="640" cy="330" r="110" fill="url(#warm)" opacity=".25" />
    <path d="M574 352 L556 404 M706 352 L724 404 M640 356 L640 406" stroke="#4d3e2e" stroke-width="5" stroke-linecap="round" />
    <path d="M552 404 h10 M718 404 h10 M634 406 h12" stroke="#4d3e2e" stroke-width="5" stroke-linecap="round" />
    <path d="M574 330 Q640 270 706 330 Z" fill="#d8c7a0" />
    <path d="M598 312 Q640 288 682 312" fill="none" stroke="#f7ecd2" stroke-width="3" opacity=".8" />
    <ellipse cx="640" cy="336" rx="122" ry="20" fill="url(#hull)" />
    <ellipse cx="640" cy="348" rx="104" ry="11" fill="#6d5a45" />
    <g fill="#ffd9a0">
      <circle cx="578" cy="335" r="4" /><circle cx="604" cy="338" r="4" /><circle cx="630" cy="339" r="4" />
      <circle cx="656" cy="339" r="4" /><circle cx="682" cy="337" r="4" /><circle cx="706" cy="334" r="4" />
    </g>
    <path d="M744 340 L768 404 M756 338 L780 402 M748 352 h12 M753 366 h12 M758 380 h12 M763 394 h12" stroke="#5a4732" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- El suelo de la plaza, en facetas. -->
  <path d="M0 410 L140 398 L300 412 L470 400 L640 414 L800 402 L800 560 L0 560 Z" fill="#46553c" />
  <path d="M0 450 L120 430 L250 452 L390 436 L540 456 L690 438 L800 452 L800 560 L0 560 Z" fill="#3b4a35" />
  <path d="M0 500 L160 482 L330 506 L500 488 L660 508 L800 492 L800 560 L0 560 Z" fill="#33402e" />
  <path d="M120 430 L250 452 L180 470 Z M540 456 L690 438 L620 476 Z" fill="#52603f" />
  <ellipse cx="400" cy="508" rx="300" ry="34" fill="#6d6a52" opacity=".55" />
  <ellipse cx="400" cy="508" rx="230" ry="22" fill="#7d7860" opacity=".5" />

  <!-- Farolillos. -->
  <path d="M40 520 L40 432 M760 520 L760 432" stroke="#2c241c" stroke-width="5" />
  <circle cx="40" cy="428" r="30" fill="url(#warm)" />
  <circle cx="760" cy="428" r="30" fill="url(#warm)" />
  <circle cx="40" cy="428" r="7" fill="#ffe0a8" />
  <circle cx="760" cy="428" r="7" fill="#ffe0a8" />

  <!-- Los Ool, juntos para la foto (de atrás adelante). -->
  <!-- La Directora: tres filamentos y abrigo largo. -->
  <g transform="translate(108 384) scale(1.3)">
    <use href="#threeFil" />
    <g fill="#5a7465"><use href="#arms" /></g>
    <use href="#feet" />
    <use href="#blob" fill="url(#old)" />
    <path d="M18 74 C30 88 70 88 82 74 L82 80 C70 92 30 92 18 80 Z" fill="#46507f" />
    <path d="M44 84 L50 76 L56 84" fill="none" stroke="#c9a24a" stroke-width="2" />
    <use href="#face" />
  </g>
  <!-- La Maestra: gafas redondas, bufanda, su libro. -->
  <g transform="translate(232 388) scale(1.26)">
    <use href="#twoFil" />
    <g fill="#5a7465"><use href="#arms" /></g>
    <use href="#feet" />
    <use href="#blob" fill="url(#old)" />
    <path d="M16 70 C28 90 72 90 84 70 L84 78 C72 94 28 94 16 78 Z" fill="#5d4a3f" />
    <g fill="#c49a5c"><circle cx="28" cy="82" r="1.6" /><circle cx="40" cy="87" r="1.6" /><circle cx="60" cy="87" r="1.6" /><circle cx="72" cy="82" r="1.6" /></g>
    <use href="#face" />
    <g fill="none" stroke="#c9a24a" stroke-width="2.2">
      <circle cx="38" cy="54" r="11" /><circle cx="62" cy="54" r="11" /><path d="M49 54 H51" />
    </g>
    <path d="M22 70 C36 80 64 80 78 70 L76 78 C62 86 38 86 24 78 Z" fill="#c4473d" />
    <path d="M70 76 L74 92 L66 92 Z" fill="#a8392f" />
    <rect x="80" y="62" width="14" height="18" rx="1.5" fill="#6b4630" transform="rotate(12 87 71)" />
    <rect x="82" y="64" width="10" height="14" fill="#f6eedb" transform="rotate(12 87 71)" />
  </g>
  <!-- El joven explorador, con su traje remendado y el casco de burbuja. -->
  <g transform="translate(340 380) scale(1.38)">
    <use href="#twoFil" />
    <g fill="#6b7445"><use href="#arms" /></g>
    <ellipse cx="37" cy="91" rx="11" ry="5" fill="#35261c" />
    <ellipse cx="63" cy="91" rx="11" ry="5" fill="#35261c" />
    <use href="#blob" fill="url(#young)" />
    <path d="M15 66 C18 86 34 92 50 92 C66 92 82 86 85 66 C70 74 30 74 15 66 Z" fill="#6b7445" />
    <rect x="24" y="76" width="12" height="9" rx="2" fill="#8a5a34" />
    <path d="M24 76 h12 v9 h-12 Z" fill="none" stroke="#eee0bf" stroke-width=".9" stroke-dasharray="2 1.6" />
    <rect x="62" y="78" width="10" height="8" rx="2" fill="#a5733f" />
    <path d="M18 68 C34 77 66 77 82 68" fill="none" stroke="#b88a3e" stroke-width="3" />
    <use href="#face" />
    <circle cx="50" cy="48" r="38" fill="url(#bubble)" stroke="#dff4ff" stroke-width="1.6" stroke-opacity=".7" />
    <path d="M26 34 Q34 20 50 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7" />
  </g>
  <!-- Un amigo, saludando. -->
  <g transform="translate(486 400) scale(1.12)">
    <use href="#twoFil" />
    <g fill="#5fa88e">
      <ellipse cx="14" cy="68" rx="5" ry="9" transform="rotate(20 14 68)" />
      <ellipse cx="90" cy="44" rx="5" ry="10" transform="rotate(30 90 44)" />
    </g>
    <use href="#feet" />
    <use href="#blob" fill="url(#young)" />
    <path d="M30 84 C42 88 58 88 70 84" fill="none" stroke="#3f5d78" stroke-width="3" />
    <use href="#face" />
  </g>
  <!-- La más pequeña, de la mano. -->
  <g transform="translate(596 434) scale(.76)">
    <use href="#twoFil" />
    <g fill="#5fa88e"><use href="#arms" /></g>
    <use href="#feet" />
    <use href="#blob" fill="url(#young)" />
    <path d="M24 78 C38 86 62 86 76 78" fill="none" stroke="#d8bd73" stroke-width="4" />
    <use href="#face" />
  </g>

  <!-- Esporas que brillan en el aire. -->
  <g fill="url(#tip)">
    <circle cx="96" cy="250" r="5" /><circle cx="300" cy="230" r="4" /><circle cx="470" cy="250" r="5" />
    <circle cx="540" cy="210" r="3.5" /><circle cx="720" cy="250" r="4" /><circle cx="380" cy="300" r="3" />
  </g>
</svg>
